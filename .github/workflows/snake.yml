name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#4a9fd8&color_dots=#eef6fb,#cfe8f7,#9fd2ee,#6fb8e2,#3f9bd4
            dist/snake-dark.svg?palette=github-dark&color_snake=#7cc7e8&color_dots=#161b22,#0e3a5a,#1d5f8a,#3f8fc4,#7cc7e8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
