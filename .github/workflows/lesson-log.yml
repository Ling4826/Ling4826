name: lesson-log

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Needs a LOG_TOKEN secret (fine-grained token of this account, no repo access)
# so private contributions count; without it the job skips instead of
# overwriting the log with public-only numbers.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOG_TOKEN: ${{ secrets.LOG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.LOG_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.LOG_TOKEN != ''
        with:
          python-version: "3.12"
      - run: python scripts/build_cards.py log dist/lesson-log.svg
        if: env.LOG_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        if: env.LOG_TOKEN != ''
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
